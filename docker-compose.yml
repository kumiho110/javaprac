services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: javaprac
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0438"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d javaprac"]
      interval: 2s
      timeout: 3s
      retries: 30